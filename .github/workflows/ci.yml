name: Shell smoke tests
on:
  push:
  pull_request:
jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and hardware selection
        run: bash tests/smoke.sh
      - name: Offline benchmark suite tests
        run: python3 -m unittest discover -s tests -p 'test_benchmark_suite.py' -v
      - name: Official Colab CLI orchestration tests (offline; no GPU allocation)
        run: |
          python3 -m unittest discover -s tests -p 'test_colab_cli.py' -v
          bash -n colab-benchmark.sh
          bash colab-benchmark.sh --dry-run --models small
          bash colab-benchmark.sh --dry-run --models edge --suite full --runs 3
      - name: Remote Colab worker syntax
        run: python3 -m py_compile scripts/colab_benchmark_cli.py scripts/colab_benchmark_job.py
      - name: Benchmark launcher dry-run and notebook validation
        run: |
          bash -n benchmark.sh
          bash benchmark.sh --dry-run --models small --suite quick
          python3 -c "import json; p=json.load(open('notebooks/benchmark_colab.ipynb')); assert p['nbformat']==4"

      - name: Laptop portable rehearsal syntax (no downloads)
        run: |
          python3 -m py_compile scripts/usb-build/rehearse.py
          bash -n prepare-usb.sh
          bash -n scripts/rehearse-usb.sh
          python3 -m py_compile scripts/edge-task.py scripts/cloud-probe.py
          python3 scripts/edge-task.py --help
          python3 scripts/cloud-probe.py --help
          bash -n workshop-install.sh
          bash workshop-install.sh --help
          python3 -m unittest discover -s tests -p 'test_edge_task.py' -v
